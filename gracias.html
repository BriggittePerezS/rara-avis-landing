<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias por tu solicitud | Rara Avis Homes</title>
    
    <!-- SCRIPT DE META PÍXEL CON EVENTO LEAD AUTOMÁTICO -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof fbq === 'function') {
                fbq('track', 'Lead');
            }
        });
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#020617',
                        'neon-cyan': '#00ffff',
                        'sky-brand': '#29b1ec',
                        'cyan-brand': '#51c6f3',
                    },
                    fontFamily: {
                        'serif-title': ['Cinzel', 'serif'],
                        'sans-clean': ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Cinzel', serif; 
            background-color: #020617;
            color: #f1f5f9;
            margin: 0;
        }

        .nav-exact-gradient {
            background: linear-gradient(to bottom, #29b1ec 0%, #51c6f3 100%);
        }

        .btn-tech-glow {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 0.15em;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-tech-glow:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), 0 0 10px rgba(41, 177, 236, 0.8);
        }

        .glass-card-tech {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(81, 198, 243, 0.15);
        }

        .bg-tech-grid {
            background-image: radial-gradient(rgba(41, 177, 236, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="selection:bg-neon-cyan selection:text-dark-bg bg-dark-bg text-slate-200 bg-tech-grid font-serif-title min-h-screen flex flex-col justify-between">

    <!-- NAVBAR SIMPLIFICADO -->
    <nav class="fixed w-full z-[100] nav-exact-gradient shadow-2xl h-20 sm:h-24 px-4 sm:px-8 md:px-12 flex items-center justify-between">
        <div class="flex items-center justify-start w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 flex-shrink-0">
            <img src="img/logo.png" alt="Rara Avis Homes Logo" class="w-full h-full object-contain scale-105">
        </div>

        <div class="flex flex-col items-center justify-center text-center px-2 min-w-0">
            <span class="text-white text-base sm:text-2xl md:text-3xl font-normal tracking-[0.2em] uppercase leading-none font-serif-title truncate">
                RARA AVIS
            </span>
            <span class="text-white/90 text-[9px] sm:text-xs font-normal tracking-[0.35em] lowercase mt-1 font-sans-clean">
                homes
            </span>
        </div>

        <div class="flex items-center gap-2 flex-shrink-0 w-16 justify-end"></div>
    </nav>

    <!-- CONTENIDO PRINCIPAL DE AGRADECIMIENTO -->
    <main class="flex-grow flex items-center justify-center px-6 pt-32 pb-20">
        <div class="max-w-2xl w-full text-center">
            <div class="glass-card-tech p-8 sm:p-12 md:p-16 rounded-[2.5rem] border border-neon-cyan/30 shadow-2xl relative overflow-hidden">
                
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-48 bg-sky-brand/20 blur-[90px] rounded-full pointer-events-none"></div>

                <div class="text-5xl sm:text-6xl mb-6">✨</div>
                
                <h1 class="text-2xl sm:text-4xl md:text-5xl font-normal uppercase tracking-widest text-white mb-4 font-serif-title">
                    ¡Solicitud Recibida!
                </h1>

                <p class="text-neon-cyan text-xs sm:text-sm uppercase tracking-[0.3em] font-semibold mb-6 font-sans-clean">
                    Gracias por confiar en Rara Avis Homes
                </p>

                <p class="text-slate-300 font-light text-sm sm:text-base leading-relaxed mb-10 font-sans-clean">
                    Hemos registrado tus datos correctamente. Ana María se pondrá en contacto contigo muy pronto para estudiar tu caso de forma totalmente personalizada.
                </p>

                <div class="flex justify-center">
                    <a href="index.html" class="bg-gradient-to-r from-sky-brand to-neon-cyan text-dark-bg font-black text-xs md:text-sm px-8 py-4 rounded-full btn-tech-glow uppercase shadow-xl text-center transition-all">
                        VOLVER AL INICIO
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-12 bg-slate-950 border-t border-white/5 text-center text-slate-500 font-light tracking-wider font-sans-clean">
        <div class="max-w-6xl mx-auto px-6">
            <div class="text-[10px] uppercase tracking-[0.3em] font-light text-slate-400">
                &copy; <span id="current-year"></span> Rara Avis Homes. Todos los derechos reservados.
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
